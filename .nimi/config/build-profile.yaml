build_profile_ref: electron-pnpm
test_command: pnpm run test:app
build_command: pnpm run build:electron:production
output_path: dist-electron-package
lockfile_path: pnpm-lock.yaml
lockfile_policy: author-install-generates-lockfile
ci_install_command: pnpm install --frozen-lockfile
targets:
  macos-aarch64:
    os: macos
    arch: arm64
    build_command: pnpm run build:electron:production
    payload_path: dist-electron-package/open-notebook-shell-darwin-arm64
    runtime_entry: payload/open-notebook-shell.app/Contents/MacOS/open-notebook-shell
  windows-x86_64:
    os: windows
    arch: x86_64
    build_command: pnpm run build:electron:production
    payload_path: dist-electron-package/open-notebook-shell-win32-x64
    runtime_entry: payload/open-notebook-shell.exe
profile_role: developer-workflow-input
